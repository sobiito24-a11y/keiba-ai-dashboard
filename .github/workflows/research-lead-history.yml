name: Research lead-history public result probe

on:
  pull_request:
    paths:
      - 'research/lead_history_source_probe.py'
      - '.github/workflows/research-lead-history.yml'

permissions:
  contents: read

jobs:
  public-source:
    if: github.head_ref == 'research/historical-lead-intent-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python research/lead_history_source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: lead-history-probe
          path: research/lead_history_debug/
