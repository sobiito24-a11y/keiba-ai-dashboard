name: Research actual pace 2026-11-07/08

on:
  pull_request:
    paths:
      - 'research/collect_actual_pace_laps_20261109.py'
      - '.github/workflows/research-actual-pace-20261109.yml'

permissions:
  contents: read

jobs:
  collect:
    if: github.head_ref == 'research/pace-actual-20261107-08'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python research/collect_actual_pace_laps_20261109.py
      - uses: actions/upload-artifact@v4
        with:
          name: actual-pace-laps-20261107-08
          path: research/actual_pace_public_20261107_08/
