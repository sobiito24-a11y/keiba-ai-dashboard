name: JRA bodyweight regression
on:
  push:
    branches: [main]
    paths:
      - "core/jra_body_weight*.py"
      - "tests/test_jra_body_weight*.py"
      - ".github/workflows/jra-bodyweight-regression.yml"
  pull_request:
    paths:
      - "core/jra_body_weight*.py"
      - "tests/test_jra_body_weight*.py"
  workflow_dispatch:
jobs:
  bodyweight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test exact JRA sources, current and all-career weights
        run: |
          python -m pytest -q \
            tests/test_jra_body_weight.py \
            tests/test_jra_body_weight_alternates.py \
            tests/test_jra_body_weight_history.py \
            tests/test_jra_body_weight_sports_history.py
      - name: Optional live Sportsnavi provider smoke
        continue-on-error: true
        run: PYTHONPATH=. python tools/verify_jra_paired_live.py
