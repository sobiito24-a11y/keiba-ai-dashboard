name: Evidence chips regression

on:
  pull_request:
    paths:
      - 'core/race_explorer_signal_rules.py'
      - 'core/race_explorer_cards.py'
      - 'core/race_explorer_ui.py'
      - 'core/game_ui_assets/race_cards.css'
      - 'tests/test_jra_class_evidence_chips.py'
      - '.github/workflows/evidence-chips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q core/race_explorer_signal_rules.py core/race_explorer_cards.py core/race_explorer_ui.py tests/test_jra_class_evidence_chips.py
      - run: pytest -q tests/test_jra_class_evidence_chips.py tests/test_race_explorer_cards.py tests/test_race_explorer_ui.py tests/test_race_explorer_columns.py
