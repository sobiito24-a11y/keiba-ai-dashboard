name: Evidence chips regression

on:
  pull_request:
    paths:
      - 'core/race_explorer_signal_rules.py'
      - 'core/race_explorer_compact_materials.py'
      - 'core/race_explorer_cards.py'
      - 'core/research_six_dimensions.py'
      - 'core/research_positioning.py'
      - 'core/research_suitability_attention.py'
      - 'tests/test_research_suitability_attention.py'
      - 'core/research_sabcd_weight_class.py'
      - 'tests/test_research_positioning.py'
      - 'tests/test_research_six_dimensions.py'
      - 'core/race_explorer_ui.py'
      - 'core/race_tendency.py'
      - 'core/game_race_ui.py'
      - 'core/nar_official_odds.py'
      - 'core/race_odds.py'
      - 'core/race_odds_ui.py'
      - 'core/race_odds_ui_live.py'
      - 'tests/test_nar_odds_live_panel.py'
      - 'tests/test_nar_official_odds.py'
      - 'core/game_ui_assets/app.css'
      - 'app.py'
      - 'tests/test_race_tendency.py'
      - 'core/race_explorer_columns.py'
      - 'tests/test_race_explorer_selected_evidence.py'
      - 'core/game_ui_assets/race_cards.css'
      - 'core/game_ui_assets/race_comparison.css'
      - 'tests/test_jra_class_evidence_chips.py'
      - 'tests/test_race_explorer_compact_materials.py'
      - 'tests/test_race_explorer_cards.py'
      - '.github/workflows/evidence-chips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q core/race_explorer_signal_rules.py core/race_explorer_compact_materials.py core/race_explorer_cards.py core/research_positioning.py core/research_suitability_attention.py tests/test_research_suitability_attention.py core/research_sabcd_weight_class.py tests/test_research_positioning.py core/research_six_dimensions.py tests/test_research_six_dimensions.py core/race_explorer_columns.py core/race_explorer_ui.py core/race_tendency.py core/game_race_ui.py core/nar_official_odds.py core/race_odds.py core/race_odds_ui.py core/race_odds_ui_live.py tests/test_nar_official_odds.py tests/test_nar_odds_live_panel.py app.py tests/test_race_tendency.py tests/test_jra_class_evidence_chips.py tests/test_race_explorer_compact_materials.py tests/test_race_explorer_selected_evidence.py
      - run: pytest -q tests/test_race_explorer_selected_evidence.py tests/test_race_explorer_compact_materials.py tests/test_jra_class_evidence_chips.py tests/test_race_explorer_cards.py tests/test_race_explorer_ui.py tests/test_race_explorer_columns.py tests/test_nar_official_odds.py tests/test_nar_odds_live_panel.py tests/test_research_positioning.py tests/test_research_suitability_attention.py tests/test_research_six_dimensions.py tests/test_race_tendency.py
